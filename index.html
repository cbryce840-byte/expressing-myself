<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderWords: Feelings & Story Playground</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Kid-friendly rounded typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-display: 'Fredoka', cursive, sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #E0F2FE 0%, #FEF3C7 50%, #FCE7F3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .font-display {
            font-family: var(--font-display);
        }

        /* 3D Tactile Toy Buttons - Strictly vibrant, joyful colors (NO black buttons) */
        .btn-toy {
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-bottom-width: 6px;
            position: relative;
            cursor: pointer;
        }
        .btn-toy:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.04);
        }
        .btn-toy:active {
            transform: translateY(3px) scale(0.98);
            border-bottom-width: 2px;
        }

        .btn-coral {
            background: linear-gradient(180deg, #FF7A7A 0%, #FF5252 100%);
            border-color: #D32F2F;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(255, 82, 82, 0.45);
        }
        .btn-sunny {
            background: linear-gradient(180deg, #FFE066 0%, #FFC107 100%);
            border-color: #E08E00;
            color: #4A2E00;
            box-shadow: 0 8px 20px -4px rgba(255, 193, 7, 0.45);
        }
        .btn-sky {
            background: linear-gradient(180deg, #60C5FF 0%, #2196F3 100%);
            border-color: #1565C0;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(33, 150, 243, 0.45);
        }
        .btn-mint {
            background: linear-gradient(180deg, #5CE1A6 0%, #10B981 100%);
            border-color: #047857;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.45);
        }
        .btn-purple {
            background: linear-gradient(180deg, #B388FF 0%, #7C4DFF 100%);
            border-color: #512DA8;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(124, 77, 255, 0.45);
        }
        .btn-tangerine {
            background: linear-gradient(180deg, #FFAB40 0%, #FF6D00 100%);
            border-color: #C43E00;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(255, 109, 0, 0.45);
        }
        .btn-pink {
            background: linear-gradient(180deg, #FF80AB 0%, #EC407A 100%);
            border-color: #AD1457;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(236, 64, 122, 0.45);
        }

        /* Floating & Bouncing Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1deg); }
        }
        @keyframes floatAlt {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-1deg); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.75) translateY(15px); }
            70% { transform: scale(1.05) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-6deg); }
            40% { transform: rotate(6deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(4deg); }
        }
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 0 4px #FF5252, 0 12px 28px rgba(255, 82, 82, 0.4); }
            33% { box-shadow: 0 0 0 4px #FFC107, 0 12px 28px rgba(255, 193, 7, 0.4); }
            66% { box-shadow: 0 0 0 4px #10B981, 0 12px 28px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 4px #7C4DFF, 0 12px 28px rgba(124, 77, 255, 0.4); }
        }
        @keyframes trainChug {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-float-1 { animation: floatSlow 3.4s ease-in-out infinite; }
        .animate-float-2 { animation: floatAlt 3.8s ease-in-out infinite 0.4s; }
        .animate-float-3 { animation: floatSlow 3.6s ease-in-out infinite 0.8s; }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-wiggle { animation: wiggle 0.5s ease-in-out; }
        .animate-rainbow { animation: rainbowGlow 1.5s linear infinite; }
        .animate-chug { animation: trainChug 0.45s ease-in-out infinite; }

        /* 3D Visual Card Styling */
        .card-3d {
            background: #FFFFFF;
            border-radius: 28px;
            border: 4px solid #E2E8F0;
            border-bottom-width: 9px;
            box-shadow: 0 14px 30px -8px rgba(15, 23, 42, 0.12);
        }

        /* Drag & Drop Bridge Slot */
        .bridge-slot {
            border: 4px dashed #60A5FA;
            background: rgba(239, 246, 255, 0.85);
            transition: all 0.25s ease;
        }
        .bridge-slot.drag-over {
            border-color: #F59E0B;
            background: #FEF3C7;
            transform: scale(1.04);
        }
        .bridge-slot.filled {
            border-style: solid;
            border-color: #10B981;
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
        }

        /* Confetti Particle */
        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Custom Scrollbar for friendly mobile/tablet look */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #93C5FD;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <header class="relative z-20 px-3 sm:px-6 pt-3 pb-2">

    <!-- Friendly Toast / Helper Banner (Never uses alert()) -->

    <script>
        /* =========================================================================
           1. AUDIO & CHEERFUL FEMALE TEXT-TO-SPEECH ENGINE
           ========================================================================= */
        const AudioEngine = {
            autoRead: true,
            sfxEnabled: true,
            preferredVoice: null,
            audioCtx: null,

            init() {
                // Load available voices and prioritize warm, cheerful female voices
                const pickVoice = () => {
                    if (!('speechSynthesis' in window)) return;
                    const voices = window.speechSynthesis.getVoices();
                    if (!voices.length) return;

                    const preferredNames = [
                        'Samantha',
                        'Google US English Female',
                        'Microsoft Zira',
                        'Victoria',
                        'Karen',
                        'Moira',
                        'Tessa',
                        'Google UK English Female',
                        'Allison',
                        'Ava',
                        'Nicky',
                        'Female'
                    ];

                    for (const name of preferredNames) {
                        const match = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
                        if (match) {
                            this.preferredVoice = match;
                            return;
                        }
                    }
                    // Fallback to any English voice
                    this.preferredVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
                };

                pickVoice();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = pickVoice;
                }
            },

            speak(text, onEndCallback = null) {
                if (!('speechSynthesis' in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                try {
                    window.speechSynthesis.cancel();
                    const cleanText = text.replace(/\[.*?\]/g, 'blank').replace(/___+/g, 'blank');
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    if (this.preferredVoice) {
                        utterance.voice = this.preferredVoice;
                    }
                    // Warm, cheerful, clear cadence for a 6-year-old
                    utterance.pitch = 1.15;
                    utterance.rate = 0.92;
                    utterance.volume = 1.0;

                    if (onEndCallback) {
                        utterance.onend = onEndCallback;
                        utterance.onerror = onEndCallback;
                    }
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    if (onEndCallback) onEndCallback();
                }
            },

            initAudioCtx() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.audioCtx = new AudioContext();
                    }
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            },

            playTone(freq, type = 'sine', duration = 0.18, delay = 0, vol = 0.18) {
                if (!this.sfxEnabled) return;
                try {
                    this.initAudioCtx();
                    if (!this.audioCtx) return;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + delay);

                    gain.gain.setValueAtTime(0.001, this.audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(vol, this.audioCtx.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + delay + duration);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(this.audioCtx.currentTime + delay);
                    osc.stop(this.audioCtx.currentTime + delay + duration + 0.02);
                } catch (e) { /* Ignore audio block errors */ }
            },

            playPop() {
                this.playTone(520, 'sine', 0.1, 0, 0.15);
                this.playTone(680, 'sine', 0.12, 0.05, 0.15);
            },

            playSuccess() {
                // Happy ascending major arpeggio chime
                this.playTone(523.25, 'triangle', 0.18, 0.00, 0.2); // C5
                this.playTone(659.25, 'triangle', 0.18, 0.10, 0.2); // E5
                this.playTone(783.99, 'triangle', 0.18, 0.20, 0.2); // G5
                this.playTone(1046.50, 'triangle', 0.38, 0.30, 0.25); // C6
            },

            playGentleTryAgain() {
                // Soft, warm two-note marimba-like nudge (never harsh)
                this.playTone(392.00, 'sine', 0.2, 0.00, 0.14); // G4
                this.playTone(349.23, 'sine', 0.25, 0.16, 0.14); // F4
            }
        };

                proud: `

                `,
                excited: `

                `,

                    <path d="M37 56 Q44 62 51 56" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round"/>

        /* =========================================================================
           3. RICH EDUCATIONAL DATASETS (46 UNIQUE ACTIVITIES ACROSS 4 MODES)
           ========================================================================= */

        // MODE 1: "Because" Bridge (16 Scenarios)
        const BECAUSE_BRIDGE_DATA = [
            {
                id: 'bb1',
                emotion: 'sad',

            {

            {

        // Fisher-Yates strict randomization shuffle
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function addStars(count = 1) {
            State.stars += count;
            const starEl = document.getElementById('star-count');
            if (starEl) {
                starEl.textContent = State.stars;
                starEl.parentElement.classList.add('animate-wiggle');
                setTimeout(() => starEl.parentElement.classList.remove('animate-wiggle'), 600);
            }
            launchConfetti();
        }

        function showToast(emoji, message, borderColor = 'border-amber-400') {
            const toast = document.getElementById('helper-toast');
            const inner = document.getElementById('helper-toast-inner');
            document.getElementById('toast-emoji').textContent = emoji;
            document.getElementById('toast-text').textContent = message;
            inner.className = `bg-white border-4 ${borderColor} border-b-8 rounded-3xl px-6 py-3 shadow-2xl flex items-center gap-3 max-w-md`;

            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2600);
        }

        function launchConfetti() {
            const colors = ['#FF5252', '#FFC107', '#10B981', '#2196F3', '#7C4DFF', '#EC4899'];
            for (let i = 0; i < 28; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = (20 + Math.random() * 60) + 'vw';
                piece.style.top = '35vh';
                document.body.appendChild(piece);

                const angle = (Math.random() * Math.PI * 2);
                const velocity = 120 + Math.random() * 240;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 150;

                piece.animate([
                    { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                    { transform: `translate(${vx}px, ${vy + 350}px) rotate(${360 + Math.random() * 360}deg) scale(0.4)`, opacity: 0 }
                ], {
                    duration: 950 + Math.random() * 450,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                }).onfinish = () => piece.remove();
            }
        }

                    <div class="card-3d border-emerald-300 p-5 sm:p-7 bg-gradient-to-b from-sky-50 to-emerald-50/60">
                        <!-- Clue Header -->
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-5 bg-white border-2 border-emerald-200 rounded-2xl px-4 py-3">
                            <div class="flex items-center gap-3">
                                <span class="text-4xl">${puzzle.icon}</span>
                                <div>
                                    <span class="text-xs font-extrabold uppercase text-emerald-600">Picture Clue</span>
                                    <p class="font-display font-bold text-lg sm:text-xl text-slate-800">${puzzle.hint}</p>
                                </div>
                            </div>
                            <button onclick="AudioEngine.speak('${puzzle.words.join(' ').replace(/'/g, "\\'")}')" class="btn-toy btn-sunny px-4 py-2 rounded-2xl font-display font-bold text-sm sm:text-base flex items-center gap-2">
                                <span>🔊</span> Hear Target Sentence
                            </button>
                        </div>

                        <!-- The Train Engine + Built Word Cars -->
                        <div class="bg-white border-4 border-emerald-300 rounded-3xl p-4 sm:p-6 min-h-[130px] flex flex-wrap items-center gap-2.5 shadow-inner relative">
                            <!-- Cute Train Engine -->
                            <div class="${State.isAnswered ? 'animate-chug' : ''} bg-rose-500 border-4 border-rose-700 text-white rounded-2xl px-4 py-3 font-display font-extrabold text-2xl flex items-center gap-2 shadow-md">
                                <span>🚂</span>
                            </div>

                            <!-- Placed Word Cars -->
                            ${State.trainBuilt.length === 0 ? `
                                <span class="font-display font-bold text-lg sm:text-xl text-slate-400 pl-2">
                                    Tap the floating word cars below in order!
                                </span>
                            ` : State.trainBuilt.map((item, idx) => `
                                <button onclick="removeWordFromTrain(${idx})"
                                        class="btn-toy ${item.word.toLowerCase() === 'because' ? 'btn-sunny' : 'btn-mint'} px-4 py-2.5 rounded-2xl font-display font-extrabold text-xl sm:text-2xl flex items-center gap-1"
                                        title="Tap to put back">
                                    <span>${item.word}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Next Train Button (Shown when sentence is complete) -->
                        ${State.isAnswered ? `
                            <div class="mt-5 pt-4 border-t-2 border-emerald-200 flex flex-wrap items-center justify-between gap-3">
                                <button onclick="AudioEngine.speak('${puzzle.words.join(' ').replace(/'/g, "\\'")}')" class="btn-toy btn-sky px-5 py-3 rounded-2xl font-display font-bold text-lg flex items-center gap-2">
                                    <span>🔊</span> Listen Again
                                </button>
                                <button onclick="nextTrainRound()" class="btn-toy btn-mint px-8 py-3.5 rounded-2xl font-display font-bold text-xl flex items-center gap-2">
                                    <span>Next Train</span> <span>➡️</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Floating Word Pool -->
                    ${!State.isAnswered ? `
                        <div class="bg-white/90 border-4 border-sky-200 rounded-3xl p-5 flex flex-wrap items-center justify-center gap-3">
                            ${State.trainPool.map((item, idx) => `
                                <button onclick="addWordToTrain(${idx})"
                                        class="btn-toy ${item.word.toLowerCase() === 'because' ? 'btn-sunny' : carColors[idx % carColors.length]} px-5 py-3 rounded-2xl font-display font-extrabold text-xl sm:text-2xl">
                                    ${item.word}
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addWordToTrain(poolIdx) {
            if (State.isAnswered) return;
            const chosen = State.trainPool.splice(poolIdx, 1)[0];
            State.trainBuilt.push(chosen);
            AudioEngine.playPop();
            AudioEngine.speak(chosen.word);

            const puzzle = State.queue[State.currentIndex];
            if (State.trainBuilt.length === puzzle.words.length) {
                const builtSentence = State.trainBuilt.map(x => x.word).join(' ');
                const targetSentence = puzzle.words.join(' ');
                if (builtSentence === targetSentence) {
                    State.isAnswered = true;
                    AudioEngine.playSuccess();
                    addStars(1);
                    showToast('🚂', 'Choo-choo! Perfect sentence train!', 'border-emerald-400');
                    setTimeout(() => AudioEngine.speak(`Choo choo! ${targetSentence}!`), 350);
                } else {
                    AudioEngine.playGentleTryAgain();
                    showToast('🔄', 'Almost! Tap a word on the train to swap its spot.', 'border-amber-400');
                    setTimeout(() => AudioEngine.speak('Almost! Let us check the word order.'), 300);
                }
            }
            renderTrainBoard();
        }

        function removeWordFromTrain(builtIdx) {
            if (State.isAnswered) return;
            const removed = State.trainBuilt.splice(builtIdx, 1)[0];
            State.trainPool.push(removed);
            AudioEngine.playPop();
            renderTrainBoard();
        }

        function nextTrainRound() {
            AudioEngine.playPop();
            State.currentIndex++;
            if (State.currentIndex >= State.queue.length) {
                State.queue = shuffleArray(WORD_TRAIN_DATA);
                State.currentIndex = 0;
                showToast('🎉', 'You built every train! Starting a new shuffled set!', 'border-emerald-400');
            }
            loadTrainRound();
        }

        /* =========================================================================
           9. GAME 4: "MY FEELINGS" HELPER (Real-Life Calm-Down & Expression Sandbox)
           ========================================================================= */
        function startFeelingsHelper() {
            AudioEngine.playPop();
            State.currentView = 'helper';
            State.selectedEmotion = MY_FEELINGS_EMOTIONS[0];
            State.selectedReason = null;
            renderFeelingsHelper();

            if (AudioEngine.autoRead) {
                setTimeout(() => {
                    AudioEngine.speak('How do you feel right now? Tap a face, then tap why!');
                }, 350);
            }
        }

        function renderFeelingsHelper() {
            const em = State.selectedEmotion;
            const reason = State.selectedReason;
            const fullSentence = reason
                ? `I feel ${em.label.toLowerCase()} because ${reason}.`
                : `I feel ${em.label.toLowerCase()} because...`;

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="animate-pop space-y-5">
                    <!-- Header -->
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white/85 rounded-3xl px-5 py-3 border-2 border-rose-200">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">💛</span>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-rose-600">"My Feelings" Helper</h2>
                        </div>
                        <span class="text-sm font-bold text-slate-600">No wrong answers — share what is on your mind!</span>
                    </div>

                    <!-- Giant Glowing Sentence Speaker Card -->
                    <div class="card-3d border-rose-300 p-5 sm:p-6 bg-gradient-to-r from-rose-50 via-white to-amber-50">
                        <div class="flex flex-col sm:flex-row items-center gap-5">
                            <div class="shrink-0">
                                ${getCharacterSVG(em.id, em.bg)}
                            </div>
                            <div class="flex-1 text-center sm:text-left space-y-3">
                                <span class="inline-block bg-rose-100 text-rose-700 text-xs font-extrabold uppercase px-3 py-1 rounded-full">
                                    My Voice Card
                                </span>
                                <p class="font-display font-extrabold text-2xl sm:text-3xl md:text-4xl text-slate-800 leading-snug">
                                    "${fullSentence}"
                                </p>
                                <div class="flex flex-wrap justify-center sm:justify-start gap-3 pt-1">
                                    <button onclick="AudioEngine.speak('${fullSentence.replace(/'/g, "\\'")}')"
                                            class="btn-toy btn-mint px-6 py-3 rounded-2xl font-display font-bold text-lg flex items-center gap-2">
                                        <span>🔊</span> Speak My Sentence
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 1: Choose Emotion -->
                    <div class="card-3d border-sky-200 p-5 space-y-3">
                        <h3 class="text-xl font-extrabold text-sky-800 flex items-center gap-2">
                            <span class="bg-sky-200 text-sky-900 w-8 h-8 rounded-full inline-flex items-center justify-center text-base">1</span>
                            How do I feel right now?
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${MY_FEELINGS_EMOTIONS.map(item => `
                                <button onclick="pickHelperEmotion('${item.id}')"
                                        class="btn-toy ${item.color} ${em.id === item.id ? 'ring-4 ring-amber-400 scale-105' : 'opacity-90'} rounded-2xl py-3 px-3 font-display font-bold text-lg flex items-center justify-center gap-2">
                                    <span>${item.label}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Step 2: Choose Reason or Type Custom Reason -->
                    <div class="card-3d border-amber-200 p-5 space-y-4">
                        <h3 class="text-xl font-extrabold text-amber-800 flex items-center gap-2">
                            <span class="bg-amber-200 text-amber-900 w-8 h-8 rounded-full inline-flex items-center justify-center text-base">2</span>
                            Because... (Pick a picture or type your own!)
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                            ${MY_FEELINGS_REASONS.map(r => `
                                <button onclick="pickHelperReason('${r.text.replace(/'/g, "\\'")}')"
                                        class="btn-toy ${reason === r.text ? 'btn-mint ring-4 ring-emerald-300' : 'btn-sunny'} rounded-2xl p-3.5 flex items-center gap-3 text-left">
                                    <span class="text-3xl shrink-0">${r.icon}</span>
                                    <span class="font-display font-bold text-base sm:text-lg leading-tight">${r.text}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Custom Parent/Kid Input Bar -->
                        <div class="pt-2 flex flex-col sm:flex-row gap-3">
                            <input id="custom-reason-input"
                                   type="text"
                                   placeholder="Or type your own reason here..."
                                   class="flex-1 rounded-2xl border-4 border-sky-200 focus:border-sky-400 outline-none px-4 py-3 font-bold text-lg text-slate-800 bg-sky-50/50"
                                   onkeydown="if(event.key==='Enter') applyCustomReason()"/>
                            <button onclick="applyCustomReason()" class="btn-toy btn-purple px-6 py-3 rounded-2xl font-display font-bold text-lg flex items-center justify-center gap-2">
                                <span>✨</span> Use My Words
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function pickHelperEmotion(emotionId) {
            const found = MY_FEELINGS_EMOTIONS.find(e => e.id === emotionId);
            if (!found) return;
            State.selectedEmotion = found;
            AudioEngine.playPop();
            renderFeelingsHelper();
            const phrase = State.selectedReason
                ? `I feel ${found.label.toLowerCase()} because ${State.selectedReason}.`
                : `I feel ${found.label.toLowerCase()}. Now pick why!`;
            AudioEngine.speak(phrase);
        }

        function pickHelperReason(reasonText) {
            State.selectedReason = reasonText;
            AudioEngine.playSuccess();
            renderFeelingsHelper();
            const full = `I feel ${State.selectedEmotion.label.toLowerCase()} because ${reasonText}.`;
            showToast('💬', 'Great job explaining your feelings!', 'border-rose-400');
            AudioEngine.speak(full);
        }

        function applyCustomReason() {
            const input = document.getElementById('custom-reason-input');
            if (!input) return;
            const val = input.value.trim().replace(/^because\s+/i, '');
            if (!val) return;
            pickHelperReason(val);
        }

        /* =========================================================================
           10. SHARED RESHUFFLE & INITIALIZATION
           ========================================================================= */
        function reshuffleCurrentGame() {
            AudioEngine.playPop();
            showToast('🔀', 'Shuffled! Fresh cards and mixed-up positions!', 'border-sky-400');
            if (State.currentView === 'bridge') {
                State.queue = shuffleArray(BECAUSE_BRIDGE_DATA);
                State.currentIndex = 0;
                loadBridgeRound();
            } else if (State.currentView === 'detective') {
                State.queue = shuffleArray(STORY_DETECTIVE_DATA);
                State.currentIndex = 0;
                loadDetectiveRound();
            } else if (State.currentView === 'train') {
                State.queue = shuffleArray(WORD_TRAIN_DATA);
                State.currentIndex = 0;
                loadTrainRound();
            }
        }

        window.onload = function() {
            AudioEngine.init();
            goHome();
        };
    </script>
</body>
  </html>
