<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderWords: Feelings & Story Playground</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Kid-friendly rounded typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-display: 'Fredoka', cursive, sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #E0F2FE 0%, #FEF3C7 50%, #FCE7F3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .font-display {
            font-family: var(--font-display);
        }

        /* 3D Tactile Toy Buttons - Strictly vibrant, joyful colors (NO black buttons) */
        .btn-toy {
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-bottom-width: 6px;
            position: relative;
            cursor: pointer;
        }
        .btn-toy:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.04);
        }
        .btn-toy:active {
            transform: translateY(3px) scale(0.98);
            border-bottom-width: 2px;
        }

        .btn-coral {
            background: linear-gradient(180deg, #FF7A7A 0%, #FF5252 100%);
            border-color: #D32F2F;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(255, 82, 82, 0.45);
        }
        .btn-sunny {
            background: linear-gradient(180deg, #FFE066 0%, #FFC107 100%);
            border-color: #E08E00;
            color: #4A2E00;
            box-shadow: 0 8px 20px -4px rgba(255, 193, 7, 0.45);
        }
        .btn-sky {
            background: linear-gradient(180deg, #60C5FF 0%, #2196F3 100%);
            border-color: #1565C0;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(33, 150, 243, 0.45);
        }
        .btn-mint {
            background: linear-gradient(180deg, #5CE1A6 0%, #10B981 100%);
            border-color: #047857;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.45);
        }
        .btn-purple {
            background: linear-gradient(180deg, #B388FF 0%, #7C4DFF 100%);
            border-color: #512DA8;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(124, 77, 255, 0.45);
        }
        .btn-tangerine {
            background: linear-gradient(180deg, #FFAB40 0%, #FF6D00 100%);
            border-color: #C43E00;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(255, 109, 0, 0.45);
        }
        .btn-pink {
            background: linear-gradient(180deg, #FF80AB 0%, #EC407A 100%);
            border-color: #AD1457;
            color: #FFFFFF;
            box-shadow: 0 8px 20px -4px rgba(236, 64, 122, 0.45);
        }

        /* Floating & Bouncing Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(1deg); }
        }
        @keyframes floatAlt {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-1deg); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.75) translateY(15px); }
            70% { transform: scale(1.05) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-6deg); }
            40% { transform: rotate(6deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(4deg); }
        }
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 0 4px #FF5252, 0 12px 28px rgba(255, 82, 82, 0.4); }
            33% { box-shadow: 0 0 0 4px #FFC107, 0 12px 28px rgba(255, 193, 7, 0.4); }
            66% { box-shadow: 0 0 0 4px #10B981, 0 12px 28px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 4px #7C4DFF, 0 12px 28px rgba(124, 77, 255, 0.4); }
        }
        @keyframes trainChug {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-float-1 { animation: floatSlow 3.4s ease-in-out infinite; }
        .animate-float-2 { animation: floatAlt 3.8s ease-in-out infinite 0.4s; }
        .animate-float-3 { animation: floatSlow 3.6s ease-in-out infinite 0.8s; }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-wiggle { animation: wiggle 0.5s ease-in-out; }
        .animate-rainbow { animation: rainbowGlow 1.5s linear infinite; }
        .animate-chug { animation: trainChug 0.45s ease-in-out infinite; }

        /* 3D Visual Card Styling */
        .card-3d {
            background: #FFFFFF;
            border-radius: 28px;
            border: 4px solid #E2E8F0;
            border-bottom-width: 9px;
            box-shadow: 0 14px 30px -8px rgba(15, 23, 42, 0.12);
        }

        /* Drag & Drop Bridge Slot */
        .bridge-slot {
            border: 4px dashed #60A5FA;
            background: rgba(239, 246, 255, 0.85);
            transition: all 0.25s ease;
        }
        .bridge-slot.drag-over {
            border-color: #F59E0B;
            background: #FEF3C7;
            transform: scale(1.04);
        }
        .bridge-slot.filled {
            border-style: solid;
            border-color: #10B981;
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
        }

        /* Confetti Particle */
        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Custom Scrollbar for friendly mobile/tablet look */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #93C5FD;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <script>
        /* =========================================================================
           1. AUDIO & CHEERFUL FEMALE TEXT-TO-SPEECH ENGINE
           ========================================================================= */
        const AudioEngine = {
            autoRead: true,
            sfxEnabled: true,
            preferredVoice: null,
            audioCtx: null,

            init() {
                // Load available voices and prioritize warm, cheerful female voices
                const pickVoice = () => {
                    if (!('speechSynthesis' in window)) return;
                    const voices = window.speechSynthesis.getVoices();
                    if (!voices.length) return;

                    const preferredNames = [
                        'Samantha',
                        'Google US English Female',
                        'Microsoft Zira',
                        'Victoria',
                        'Karen',
                        'Moira',
                        'Tessa',
                        'Google UK English Female',
                        'Allison',
                        'Ava',
                        'Nicky',
                        'Female'
                    ];

                    for (const name of preferredNames) {
                        const match = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
                        if (match) {
                            this.preferredVoice = match;
                            return;
                        }
                    }
                    // Fallback to any English voice
                    this.preferredVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
                };

                pickVoice();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = pickVoice;
                }
            },

            speak(text, onEndCallback = null) {
                if (!('speechSynthesis' in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                try {
                    window.speechSynthesis.cancel();
                    const cleanText = text.replace(/\[.*?\]/g, 'blank').replace(/___+/g, 'blank');
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    if (this.preferredVoice) {
                        utterance.voice = this.preferredVoice;
                    }
                    // Warm, cheerful, clear cadence for a 6-year-old
                    utterance.pitch = 1.15;
                    utterance.rate = 0.92;
                    utterance.volume = 1.0;

                    if (onEndCallback) {
                        utterance.onend = onEndCallback;
                        utterance.onerror = onEndCallback;
                    }
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    if (onEndCallback) onEndCallback();
                }
            },

            initAudioCtx() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.audioCtx = new AudioContext();
                    }
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            },

            playTone(freq, type = 'sine', duration = 0.18, delay = 0, vol = 0.18) {
                if (!this.sfxEnabled) return;
                try {
                    this.initAudioCtx();
                    if (!this.audioCtx) return;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + delay);

                    gain.gain.setValueAtTime(0.001, this.audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(vol, this.audioCtx.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + delay + duration);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(this.audioCtx.currentTime + delay);
                    osc.stop(this.audioCtx.currentTime + delay + duration + 0.02);
                } catch (e) { /* Ignore audio block errors */ }
            },

            playPop() {
                this.playTone(520, 'sine', 0.1, 0, 0.15);
                this.playTone(680, 'sine', 0.12, 0.05, 0.15);
            },

            playSuccess() {
                // Happy ascending major arpeggio chime
                this.playTone(523.25, 'triangle', 0.18, 0.00, 0.2); // C5
                this.playTone(659.25, 'triangle', 0.18, 0.10, 0.2); // E5
                this.playTone(783.99, 'triangle', 0.18, 0.20, 0.2); // G5
                this.playTone(1046.50, 'triangle', 0.38, 0.30, 0.25); // C6
            },

            playGentleTryAgain() {
                // Soft, warm two-note marimba-like nudge (never harsh)
                this.playTone(392.00, 'sine', 0.2, 0.00, 0.14); // G4
                this.playTone(349.23, 'sine', 0.25, 0.16, 0.14); // F4
            },

            playStickerFanfare() {
                // Exciting celebratory fanfare when unlocking a dinosaur/snake/spider sticker
                this.playTone(523.25, 'triangle', 0.14, 0.00, 0.22); // C5
                this.playTone(659.25, 'triangle', 0.14, 0.12, 0.22); // E5
                this.playTone(783.99, 'triangle', 0.14, 0.24, 0.22); // G5
                this.playTone(1046.50, 'triangle', 0.22, 0.36, 0.25); // C6
                this.playTone(783.99, 'triangle', 0.14, 0.56, 0.20); // G5
                this.playTone(1046.50, 'triangle', 0.45, 0.70, 0.28); // C6
            }
        };

        const STORAGE_KEY = 'wonderwords_dino_snake_spider_v1';

        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    State.stars = typeof parsed.stars === 'number' ? parsed.stars : 0;
                    State.unlockedStickers = Array.isArray(parsed.unlockedStickers) ? parsed.unlockedStickers : [];
                    State.placedSceneStickers = Array.isArray(parsed.placedSceneStickers) ? parsed.placedSceneStickers : [];
                }
            } catch (e) { /* Ignore storage issues */ }
            updateTopBarUI();
        }

        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    stars: State.stars,
                    unlockedStickers: State.unlockedStickers,
                    placedSceneStickers: State.placedSceneStickers
                }));
            } catch (e) { /* Ignore storage issues */ }
        }

        function updateTopBarUI() {
            const starEl = document.getElementById('star-count');
            if (starEl) starEl.textContent = State.stars;

            const badgeEl = document.getElementById('sticker-badge');
            if (badgeEl) badgeEl.textContent = `${State.unlockedStickers.length}/${STICKER_COLLECTION.length}`;

            const progressInCycle = State.stars % 5;
            const labelEl = document.getElementById('next-sticker-label');
            const barEl = document.getElementById('next-sticker-bar');
            if (labelEl && barEl) {
                if (State.unlockedStickers.length >= STICKER_COLLECTION.length) {
                    labelEl.textContent = 'All Stickers Unlocked!';
                    barEl.style.width = '100%';
                } else {
                    labelEl.textContent = `Next Sticker: ${progressInCycle} / 5`;
                    barEl.style.width = `${(progressInCycle / 5) * 100}%`;
                }
            }
        }

        // Fisher-Yates strict randomization shuffle
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function addStars(count = 1) {
            const prevStars = State.stars;
            State.stars += count;
            const starEl = document.getElementById('star-count');
            if (starEl) {
                starEl.parentElement.classList.add('animate-wiggle');
                setTimeout(() => starEl.parentElement.classList.remove('animate-wiggle'), 600);
            }
            launchConfetti();

            // Check if a 5-star milestone was crossed to unlock a new Dino/Snake/Spider sticker!
            const prevMilestones = Math.floor(prevStars / 5);
            const newMilestones = Math.floor(State.stars / 5);

            if (newMilestones > prevMilestones) {
                unlockNextSticker();
            }

            updateTopBarUI();
            saveProgress();

        function launchConfetti() {
            const colors = ['#FF5252', '#FFC107', '#10B981', '#2196F3', '#7C4DFF', '#EC4899'];
            for (let i = 0; i < 28; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = (20 + Math.random() * 60) + 'vw';
                piece.style.top = '35vh';
                document.body.appendChild(piece);

                const angle = (Math.random() * Math.PI * 2);
                const velocity = 120 + Math.random() * 240;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 150;

                piece.animate([
                    { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                    { transform: `translate(${vx}px, ${vy + 350}px) rotate(${360 + Math.random() * 360}deg) scale(0.4)`, opacity: 0 }
                ], {
                    duration: 950 + Math.random() * 450,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                }).onfinish = () => piece.remove();
            }
        }

        /* =========================================================================
           8. GAME 3: WORD TRAIN BUILDER (Sentence Comprehension & Ordering)

        function startWordTrain() {
            AudioEngine.playPop();
            State.currentView = 'train';
            State.queue = shuffleArray(WORD_TRAIN_DATA);
            State.currentIndex = 0;
            loadTrainRound();
        }

        function loadTrainRound() {
            const puzzle = State.queue[State.currentIndex];
            State.isAnswered = false;
            State.trainBuilt = [];

            // Shuffle words so they are guaranteed not to be in already-solved order
            let scrambled = shuffleArray(puzzle.words.map((w, i) => ({ id: i, word: w })));
            if (scrambled.map(x => x.word).join(' ') === puzzle.words.join(' ')) {
                scrambled.reverse();
            }
            State.trainPool = scrambled;

            renderTrainBoard();

            if (AudioEngine.autoRead) {
                setTimeout(() => {
                    AudioEngine.speak(`Build the sentence! Hint: ${puzzle.hint}`);
                }, 350);
            }
        }

        function renderTrainBoard() {
            const puzzle = State.queue[State.currentIndex];

            const container = document.getElementById('app-container');

        function addWordToTrain(poolIdx) {
            if (State.isAnswered) return;
            const chosen = State.trainPool.splice(poolIdx, 1)[0];
            State.trainBuilt.push(chosen);

            if (State.trainBuilt.length === puzzle.words.length) {
                const builtSentence = State.trainBuilt.map(x => x.word).join(' ');

                                </button>
                            ` : ''}
                        </div>

                        <!-- Prehistoric Jungle SVG Backdrop Canvas -->
                        <div id="jungle-scene-canvas"
                             onclick="placeStickerInScene(event)"
                             class="relative w-full h-64 sm:h-80 rounded-3xl border-4 border-emerald-300 overflow-hidden cursor-pointer select-none shadow-inner"
                             style="background: linear-gradient(180deg, #7DD3FC 0%, #BAE6FD 55%, #86EFAC 55%, #22C55E 100%);">
                            <!-- Decorative Volcano, Sun, Trees & Cobweb SVG Scenery -->
                            <svg viewBox="0 0 800 320" preserveAspectRatio="none" class="w-full h-full pointer-events-none">
                                <!-- Warm Sun -->
                                <circle cx="710" cy="60" r="36" fill="#FDE047" opacity="0.9"/>
                                <!-- Distant Volcano -->
                                <polygon points="140,185 230,65 275,65 365,185" fill="#78716C"/>
                                <polygon points="230,65 275,65 262,88 252,78 242,90" fill="#F97316"/>
                                <!-- Rolling Jungle Hills -->
                                <ellipse cx="180" cy="210" rx="260" ry="55" fill="#4ADE80"/>
                                <ellipse cx="620" cy="215" rx="280" ry="60" fill="#22C55E"/>
                                <!-- Prehistoric Fern Trees -->
                                <rect x="65" y="110" width="16" height="90" rx="6" fill="#92400E"/>
                                <ellipse cx="73" cy="105" rx="45" ry="24" fill="#15803D"/>
                                <rect x="705" y="115" width="16" height="95" rx="6" fill="#92400E"/>
                                <ellipse cx="713" cy="110" rx="48" ry="26" fill="#166534"/>
                                <!-- Little Pond for Snakes & Dinos -->
                                <ellipse cx="420" cy="260" rx="115" ry="28" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
                            </svg>

                            <!-- Placed Stickers Layer -->
                            ${State.placedSceneStickers.map(item => `
                                <div onclick="event.stopPropagation(); removePlacedSticker('${item.uid}')"
                                     title="Tap sticker to pick up"
                                     class="absolute w-16 h-16 sm:w-20 sm:h-20 -translate-x-1/2 -translate-y-1/2 transition-transform hover:scale-110 cursor-pointer drop-shadow-md"
                                     style="left: ${item.x}%; top: ${item.y}%;">
                                    ${getStickerSVG(item.id, false)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function interactWithSticker(stickerId) {
            const sticker = STICKER_COLLECTION.find(s => s.id === stickerId);
            if (!sticker) return;
            AudioEngine.playPop();
            State.selectedStickerToPlace = stickerId;
            AudioEngine.speak(`${sticker.name}! ${sticker.fact}`);
            showToast(sticker.badge, `${sticker.name} selected! Tap the jungle to place it!`, 'border-emerald-400');
            renderStickerBook();
        }

        function lockedStickerHint() {
            AudioEngine.playGentleTryAgain();
            const needed = 5 - (State.stars % 5);
            showToast('🔒', `Earn ${needed} more star${needed === 1 ? '' : 's'} to unlock a new creature sticker!`, 'border-amber-400');
            AudioEngine.speak(`Keep playing any game! Earn ${needed} more stars to unlock a new sticker!`);
        }

        function placeStickerInScene(event) {
            if (!State.selectedStickerToPlace) {
                if (State.unlockedStickers.length > 0) {
                    // Automatically pick their most recently unlocked sticker for effortless tapping
                    State.selectedStickerToPlace = State.unlockedStickers[State.unlockedStickers.length - 1];
                } else {
                    lockedStickerHint();
                    return;
                }
            }
            const canvas = document.getElementById('jungle-scene-canvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const xPct = Math.max(8, Math.min(92, ((event.clientX - rect.left) / rect.width) * 100));
            const yPct = Math.max(12, Math.min(88, ((event.clientY - rect.top) / rect.height) * 100));

            State.placedSceneStickers.push({
                uid: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                id: State.selectedStickerToPlace,
                x: xPct.toFixed(1),
                y: yPct.toFixed(1)
            });
            AudioEngine.playSuccess();
            saveProgress();
            renderStickerBook();
        }

        function removePlacedSticker(uid) {
            AudioEngine.playPop();
            State.placedSceneStickers = State.placedSceneStickers.filter(p => p.uid !== uid);
            saveProgress();
            renderStickerBook();
        }

        function clearJungleScene() {
            AudioEngine.playPop();
            State.placedSceneStickers = [];
            saveProgress();
            renderStickerBook();
        }

        /* =========================================================================
           11. SHARED RESHUFFLE & INITIALIZATION
           ========================================================================= */
        function reshuffleCurrentGame() {
            AudioEngine.playPop();
            showToast('🔀', 'Shuffled! Fresh cards and mixed-up positions!', 'border-sky-400');
            if (State.currentView === 'bridge') {
                State.queue = shuffleArray(BECAUSE_BRIDGE_DATA);
                State.currentIndex = 0;
                loadBridgeRound();
            } else if (State.currentView === 'detective') {
                State.queue = shuffleArray(STORY_DETECTIVE_DATA);
                State.currentIndex = 0;
                loadDetectiveRound();
            } else if (State.currentView === 'train') {
                State.queue = shuffleArray(WORD_TRAIN_DATA);
                State.currentIndex = 0;
                loadTrainRound();
            }
        }

        window.onload = function() {
            AudioEngine.init();
            loadProgress();
            goHome();
        };
    </script>
</body>
</html>
